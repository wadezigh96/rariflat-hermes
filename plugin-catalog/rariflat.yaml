name: rariflat
title: Rariflat
description: >-
  Live character reactions for Hermes tool calls; local reliability learning
  and explainable recommendations for observed tools based on task fit,
  reliability, measured usage-frequency rarity, and repeated-call restraint.
  Recommendations are advisory: Rariflat does not dispatch tasks or invoke
  selected tools. Its failure-streak and repeated-call guard is opt-in and
  disabled by default. Tool arguments are inspected in memory; credential-like
  fields and recognized inline secrets are filtered before token learning and
  fingerprinting. Raw arguments and credentials are not intentionally
  persisted. The plugin initiates no network requests, telemetry, or subprocesses.
repo: https://github.com/wadezigh96/rariflat-hermes
sha: 911a10bac40ff536115f7485d4bba42186f36e83
version: "2.0.0"
maintainer: wadezigh96
tier: community
category: desktop
requires_hermes: ">=0.22.6"
docs_url: https://github.com/wadezigh96/rariflat-hermes#readme
capabilities:
  provides_tools:
    - rariflat_route
    - rariflat_status
    - rariflat_guard
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_middleware: []
  requires_env: []
