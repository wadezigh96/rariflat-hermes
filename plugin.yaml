name: rariflat
version: "1.2.0"
description: Tool-call status characters, tool reliability tracking, task-aware tool suggestions, and an optional opt-in guard.
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/wadezigh96/rariflat-hermes
tags: [status, router, reliability, guard, desktop]
requires_hermes: ">=0.21"
provides_tools:
  - rariflat_route
  - rariflat_status
  - rariflat_guard
provides_hooks:
  - pre_tool_call
  - post_tool_call
