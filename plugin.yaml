name: rariflat
version: "1.1.0"
description: Visual Agent Status + Intelligent Router. Characters react on every tool call. Routes and guards skills by rarity + restraint.
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/wadezigh96/rariflat-hermes
tags: [visual, status, router, guard, skills, desktop]
provides_tools:
  - rariflat_route
  - rariflat_status
  - rariflat_guard
provides_hooks:
  - pre_tool_call
  - post_tool_call
requires_hermes: ">=0.21"
