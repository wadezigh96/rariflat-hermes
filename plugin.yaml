name: rariflat
version: "2.0.0"
description: Tool-call status characters, reliability scoring, task-aware tool recommendations with measured rarity and restraint, and an opt-in loop/circuit-breaker guard.
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/wadezigh96/rariflat-hermes
tags: [status, router, reliability, guard, desktop]
requires_hermes: ">=0.22.6"
provides_tools:
  - rariflat_route
  - rariflat_status
  - rariflat_guard
provides_hooks:
  - pre_tool_call
  - post_tool_call
